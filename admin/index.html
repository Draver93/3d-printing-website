<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Администрирование — Suntar-Plastic</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark">🖨</span>
        <div>
          <h1>Suntar-Plastic</h1>
          <span class="brand-sub">Панель управления сайтом</span>
        </div>
      </div>
      <div class="header-actions">
        <a class="site-link" id="siteLink" hidden target="_blank" rel="noopener">Открыть сайт ↗</a>
        <span class="dirty-pill" id="dirtyPill" hidden></span>
        <button class="btn-secondary" id="refreshBtn">Загрузить заново</button>
        <button class="btn-primary" id="publishBtn">Опубликовать всё</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Разделы"></aside>
    <main class="content">
      <div class="page-head">
        <h2 id="pageTitle"></h2>
        <p id="pageSub"></p>
      </div>
      <div class="status-bar" id="statusBar"></div>
      <div class="form-panel" id="formPanel"></div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
