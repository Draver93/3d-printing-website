<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suntar-Plastic Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>Suntar<span>-Plastic</span> Admin</h1>
      <div class="header-actions">
        <select id="fileTypeSelect" class="file-type-select">
          <option value="services">Services</option>
          <option value="gallery">Gallery</option>
          <option value="news">News & Tips</option>
          <option value="testimonials">Testimonials</option>
          <option value="materials">Materials</option>
          <option value="pricing">Pricing</option>
          <option value="faq">FAQ</option>
          <option value="promo">Promo Banner</option>
          <option value="social">Social Links</option>
        </select>
        <button class="btn-secondary" id="loadBtn">Load</button>
        <button class="btn-primary" id="saveBtn">Save</button>
      </div>
    </div>
  </header>

  <main>
    <div class="config-bar">
      <div class="config-field">
        <label>GitHub Token</label>
        <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off">
      </div>
      <div class="config-field">
        <label>Repo (owner/repo)</label>
        <input type="text" id="repoInput" placeholder="username/3d-printing-website">
      </div>
      <div class="config-field">
        <label>Branch</label>
        <input type="text" id="branchInput" value="main">
      </div>
    </div>
    <div class="status-bar" id="statusBar"></div>

    <div class="form-panel" id="formPanel"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
