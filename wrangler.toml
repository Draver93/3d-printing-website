name = "3d-printing-website"
compatibility_date = "2026-08-01"
pages_build_output_dir = "."

[vars]
SITE_ORIGIN = "https://<your-site-domain>.com"
# TURNSTILE_SECRET — optional. Only set this if you enable the Turnstile
# CAPTCHA in script.js (TURNSTILE_SITEKEY). Leave commented to keep the
# form CAPTCHA-free; spam is still blocked by honeypot + per-IP rate limit.

# Secrets — set via `wrangler pages secret put` (dialog or --name flag):
#   TELEGRAM_TOKEN   bot token from @BotFather
#   TELEGRAM_CHAT_ID your chat id (via @userinfobot)
#   API_TOKEN        admin token for /api/requests
#   TURNSTILE_SECRET secret key from Cloudflare Turnstile (if enabled)

[[d1_databases]]
binding = "DB"
database_name = "requests"
database_id = "<paste-d1-database-id-from-wrangler-d1-create>"

[[r2_buckets]]
binding = "R2"
bucket_name = "3dp-uploads"